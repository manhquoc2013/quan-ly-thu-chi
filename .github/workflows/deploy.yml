name: Deploy to GitHub Pages

# Deploy qua GitHub Actions (Pages Source = GitHub Actions).
# Chỉ chạy khi push tag v* và tag đó trỏ tới commit trên main.
on:
  push:
    tags: ['v*']

# Cho phép Actions deploy Pages (không cần push nhánh gh-pages)
permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Ensure tag is on main
        run: |
          set -euo pipefail
          git fetch --no-tags origin main
          if ! git merge-base --is-ancestor "${GITHUB_SHA}" origin/main; then
            echo "::error::Deploy bị chặn: tag phải trỏ tới commit đã có trên nhánh main."
            echo "Tag: ${GITHUB_REF_NAME}"
            echo "Commit: ${GITHUB_SHA}"
            echo "main tip: $(git rev-parse origin/main)"
            exit 1
          fi
          echo "OK: ${GITHUB_REF_NAME} → ${GITHUB_SHA} nằm trên origin/main"

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Run tests
        run: npm run test

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Build
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
          # Kilo on Pages goes through Supabase Edge Function (CORS proxy)
          VITE_KILO_GATEWAY_BASE: ${{ format('{0}/functions/v1/kilo-proxy', secrets.VITE_SUPABASE_URL) }}
          VITE_EMAILJS_SERVICE_ID: ${{ secrets.VITE_EMAILJS_SERVICE_ID }}
          VITE_EMAILJS_TEMPLATE_ID: ${{ secrets.VITE_EMAILJS_TEMPLATE_ID }}
          VITE_EMAILJS_PUBLIC_KEY: ${{ secrets.VITE_EMAILJS_PUBLIC_KEY }}
        run: npx vite build --base=/quan-ly-thu-chi/

      - name: SPA fallback for GitHub Pages
        run: cp dist/index.html dist/404.html

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
